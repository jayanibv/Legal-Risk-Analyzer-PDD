name: "1. Selenium & API Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  selenium-api-tests:
    name: "Selenium + API Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Chrome
        run: |
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -r selenium_tests/requirements.txt

      - name: Warm up backend (Render cold-start ~60s)
        run: |
          echo "Waking up Render backend..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 30 || echo "0")
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Backend is up!"
              break
            fi
            sleep 10
          done

      - name: Run Selenium & API Tests
        run: |
          cd selenium_tests
          pytest . -v --tb=short --no-header -p no:warnings

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report-${{ github.run_number }}
          path: selenium_tests/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
