name: "4. Appium Mobile Tests"

on:
  workflow_dispatch:   # Manual trigger only — emulator takes ~8 mins, don't run on every push

jobs:
  appium-tests:
    name: "Appium Android E2E Tests (371 test cases)"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout (includes LegalRiskAnalyzer.apk) ─────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false   # APK is tracked normally (not LFS)

      # ── 2. Java (required for Android SDK / Emulator) ─────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Android SDK + Emulator image ──────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android emulator packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64" "emulator"

      # ── 4. Create & start emulator ────────────────────────────────────────────
      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            --name "test_avd" \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_4" \
            --force

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER

      - name: Start Android emulator (background)
        run: |
          $ANDROID_HOME/emulator/emulator \
            -avd test_avd \
            -no-window \
            -no-audio \
            -no-snapshot \
            -gpu swiftshader_indirect \
            &
          echo "Emulator PID: $!"

      - name: Wait for emulator to boot
        run: |
          echo "Waiting for emulator to boot (up to 5 minutes)..."
          $ANDROID_HOME/platform-tools/adb wait-for-device
          # Poll until boot is complete
          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Attempt $i: boot_completed=$BOOT"
            if [ "$BOOT" = "1" ]; then
              echo "✅ Emulator booted!"
              break
            fi
            sleep 5
          done
          adb shell input keyevent 82   # Unlock screen
          adb devices

      # ── 5. Node.js + Appium server ────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium + UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed

      - name: Start Appium server (background)
        run: |
          appium --port 4723 --log-level error &
          echo "Waiting for Appium to start..."
          sleep 8
          curl -s http://127.0.0.1:4723/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Appium ready:', d['value']['build']['version'])"

      # ── 6. Python + test dependencies ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r frontend/appium-tests/requirements.txt

      # ── 7. Install APK on emulator ────────────────────────────────────────────
      - name: Install APK on emulator
        run: |
          adb install -r -g LegalRiskAnalyzer.apk
          echo "✅ APK installed"
          adb shell pm list packages | grep legalrisk

      # ── 8. Warm up backend ────────────────────────────────────────────────────
      - name: Warm up backend (Render cold-start)
        run: |
          echo "Pinging backend..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 30 || echo "0")
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Backend is up!"
              break
            fi
            sleep 10
          done

      # ── 9. Run Appium tests ───────────────────────────────────────────────────
      - name: Run Appium E2E Tests
        run: |
          cd frontend/appium-tests
          pytest . -v --tb=short --no-header -p no:warnings
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # ── 10. Upload Excel report ───────────────────────────────────────────────
      - name: Upload Appium test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report-${{ github.run_number }}
          path: frontend/appium-tests/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
