name: "4. Appium Mobile Tests (BrowserStack)"

on:
  workflow_dispatch:   # Trigger manually from GitHub Actions tab

jobs:
  appium-browserstack:
    name: "Appium E2E Tests on BrowserStack Real Devices"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout (includes LegalRiskAnalyzer.apk) ─────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r frontend/appium-tests/requirements.txt

      # ── 3. Upload APK to BrowserStack ─────────────────────────────────────────
      #    BrowserStack gives back a "bs://..." URL that points to your uploaded APK.
      #    We store this URL as BROWSERSTACK_APP_URL for the tests to use.
      - name: Upload APK to BrowserStack
        id: upload_apk
        run: |
          echo "Uploading LegalRiskAnalyzer.apk to BrowserStack..."
          RESPONSE=$(curl -s -u "${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@LegalRiskAnalyzer.apk" \
            -F "custom_id=LegalRiskAnalyzer")
          echo "BrowserStack response: $RESPONSE"
          APP_URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['app_url'])")
          echo "APP_URL=$APP_URL"
          echo "BROWSERSTACK_APP_URL=$APP_URL" >> $GITHUB_ENV

      # ── 4. Warm up backend (Render cold-start) ────────────────────────────────
      - name: Warm up backend
        run: |
          echo "Pinging backend..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 30 || echo "0")
            echo "Attempt $i → HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "✅ Backend is up!"
              break
            fi
            sleep 10
          done

      # ── 5. Run Appium tests (connects to BrowserStack, no emulator) ───────────
      - name: Run Appium Tests on BrowserStack
        run: |
          cd frontend/appium-tests
          pytest . -v --tb=short --no-header -p no:warnings
        env:
          BROWSERSTACK_USERNAME:   ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL:    ${{ env.BROWSERSTACK_APP_URL }}
          PYTHONDONTWRITEBYTECODE: "1"

      # ── 6. Upload Excel report ────────────────────────────────────────────────
      - name: Upload Appium test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-browserstack-report-${{ github.run_number }}
          path: frontend/appium-tests/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
