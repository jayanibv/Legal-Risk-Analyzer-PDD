name: "4. Appium Mobile Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  appium-mock-tests:
    name: "Appium Android E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install openpyxl pytest

      - name: Run Appium Android UI Tests
        run: |
          pytest app/appium-tests/test_01_login_screen.py --tb=short --no-header

      - name: Upload Appium Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report-${{ github.run_number }}
          path: app/appium-tests/Appium_Fresh_Test_Report_*.xlsx
          if-no-files-found: ignore
          retention-days: 30
