name: "2. Functional Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  functional-tests:
    name: "Functional Tests (functional_tests/)"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Chrome (for Selenium-based functional tests) ──────────────────────────
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ── Python dependencies ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pytest requests selenium webdriver-manager openpyxl pandas

      # ── Warmup backend (Render free-tier cold start) ──────────────────────────
      - name: Warm up backend (Render cold-start)
        run: |
          echo "Pinging backend to wake Render free-tier instance..."
          READY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 30 || echo "0")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend returned 200 — waiting 20s for full initialization..."
              sleep 20
              STATUS2=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 15 || echo "0")
              echo "Verification ping: HTTP $STATUS2"
              READY=1
              break
            fi
            sleep 10
          done
          if [ "$READY" = "0" ]; then
            echo "Backend never returned 200 — proceeding anyway (tests will handle errors)"
          fi

      # ── Run functional tests ──────────────────────────────────────────────────
      - name: Run Functional Tests
        run: |
          cd functional_tests
          pytest . -v --tb=short --no-header -p no:warnings
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # ── Upload Excel report as artifact ──────────────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: functional_tests/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
