name: "3. Load Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  load-tests:
    name: "Load / Stress Tests (load_tests/)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Python dependencies ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests openpyxl pytest

      # ── Warmup backend (Render free-tier cold start) ──────────────────────────
      - name: Warm up backend (Render cold-start)
        run: |
          echo "Pinging backend to wake Render free-tier instance..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legal-risk-analyzer-pdd.onrender.com/ --max-time 30 || echo "0")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -lt 500 ] && [ "$STATUS" -gt 0 ]; then
              echo "Backend is up!"
              break
            fi
            sleep 10
          done

      # ── Run load test ─────────────────────────────────────────────────────────
      - name: Run Load Tests (300 VUs, 60 seconds)
        run: |
          pytest load_tests/load_test_baseline.py --tb=short --no-header
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # ── Upload Excel report as artifact ──────────────────────────────────────
      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load_tests/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
