[pytest]
# Appium Mobile E2E Test Configuration
# Legal Risk Analyzer - Android App

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    tc: test case ID marker (TC001, TC002, ...)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Timeouts
timeout = 120

# Output
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings
